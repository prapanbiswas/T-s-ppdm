# ==============================================================================
# GITHUB ACTIONS WORKFLOW: Android App Compilation & GitHub Release
# ==============================================================================
# This file is also placed in .github/workflows/build-and-release.yml
# Triggers on push to main/master, git version tags (v*), or manual dispatch.
# ==============================================================================

name: Build and Release Android Debug APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name to release (e.g. 1.0 or 1.1)'
        required: false
        default: ''
      release_notes:
        description: 'Release Notes (বাংলা / English)'
        required: false
        default: 'শারদীয় দুর্গোৎসব টি-শার্ট বিতরণ ও অর্ডার ব্যবস্থাপনা নতুন আপডেট'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Required for AGP 9.1 & Gradle 9.3)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Accept Android SDK Licenses & Prepare Environment
        run: |
          # Use pre-installed Android SDK on GitHub runner
          echo "ANDROID_HOME: $ANDROID_HOME"
          if command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses 2>/dev/null || true
          elif [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          fi
          
          # Create placeholder .env for secrets plugin
          touch .env
          
          # Restore debug.keystore if base64 file exists, or generate one
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          
          # Ensure gradlew executable permissions
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Extract App Version from build.gradle.kts
        id: get_version
        run: |
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          VERSION_CODE=$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | awk '{print $3}')
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
          fi
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0"
          fi
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE="1"
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "TAG_NAME=v${VERSION_NAME}" >> $GITHUB_ENV
          echo "Building debug version ${VERSION_NAME} (code ${VERSION_CODE})"

      - name: Build Debug APK
        run: |
          echo "Compiling Android application in Debug mode with ./gradlew assembleDebug..."
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-configuration-cache --stacktrace
          else
            gradle assembleDebug --no-configuration-cache --stacktrace
          fi

      - name: Prepare Debug APK Artifacts
        run: |
          mkdir -p release-output
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$DEBUG_APK" ]; then
            DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          
          if [ ! -f "$DEBUG_APK" ]; then
            DEBUG_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          if [ -f "$DEBUG_APK" ]; then
            echo "Found Debug APK: $DEBUG_APK"
            cp "$DEBUG_APK" release-output/app-debug.apk
            cp "$DEBUG_APK" "release-output/PodderparaDurgaMandir-v${{ env.VERSION_NAME }}.apk"
          else
            echo "Error: No debug APK found at $DEBUG_APK"
            exit 1
          fi

          # Generate version.json for the in-app auto-update checker
          cat <<EOF > release-output/version.json
          {
            "versionCode": ${{ env.VERSION_CODE }},
            "versionName": "${{ env.VERSION_NAME }}",
            "tag": "${{ env.TAG_NAME }}",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/PodderparaDurgaMandir-v${{ env.VERSION_NAME }}.apk",
            "releaseNotes": "শারদীয় দুর্গোৎসব টি-শার্ট বিতরণ ও অর্ডার ব্যবস্থাপনা v${{ env.VERSION_NAME }}",
            "updatedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-v${{ env.VERSION_NAME }}
          path: release-output/
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "রিলিজ ${{ env.TAG_NAME }} (v${{ env.VERSION_NAME }})"
          body: |
            ## পোদ্দারপাড়া সর্বজনীন দুর্গা মন্দির — টি-শার্ট বিতরণ ও অর্ডার ব্যবস্থাপনা
            **বর্তমান সংস্করণ:** v${{ env.VERSION_NAME }} (বিল্ড ${{ env.VERSION_CODE }})
            
            ### 📲 সরাসরি Debug APK ডাউনলোড ও ইনস্টল
            - **[PodderparaDurgaMandir-v${{ env.VERSION_NAME }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/PodderparaDurgaMandir-v${{ env.VERSION_NAME }}.apk)** (অ্যান্ড্রয়েড ফোনের জন্য প্রস্তুত)
            - **[app-debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/app-debug.apk)** (ডাউনলোড বিকল্প লিংক)
            
            ### 🚀 নতুন সুবিধাসমূহ
            - গ্রাহক অর্ডার তালিকা ও কারখানা সাইজ সাবটোটাল শীট
            - অ্যাপের স্বয়ংক্রিয় আপডেট ও সরাসরি ইনস্টলেশন সুবিধা
            - ক্লাউড ব্যাকআপ ও এসএমএস গেটওয়ে ইন্টিগ্রেশন
          draft: false
          prerelease: false
          files: |
            release-output/PodderparaDurgaMandir-v${{ env.VERSION_NAME }}.apk
            release-output/app-debug.apk
            release-output/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
